name: Update dashboard

on:
  schedule:
    # 22:23 UTC on weekdays = 07:23 KST the next morning, ~2h after the US close.
    # 정각(:00)은 전 세계 워크플로가 몰려 깃허브 큐에서 1~2시간씩 밀린다.
    # 어중간한 분으로 옮겨 두면 예약 시각에 훨씬 가깝게 돈다.
    - cron: "23 22 * * 1-5"
    # 03:17 UTC Tue–Sat = 23:17 ET (12:17 KST) — 보충 실행. 나스닥이 그날 종가를
    # 몇 시간 늦게 올리거나 러너에서 야후가 막히면 첫 실행은 전 거래일 값으로
    # 끝난다. 그 뒤로 한 번 더 돌려 늦게 올라온 종가를 같은 날 안에 반영한다.
    - cron: "17 3 * * 2-6"
  workflow_dispatch:        # manual run button
  push:
    branches: [main]
    paths: ["build/**", "data/themes.json", "data/auth.json", ".github/workflows/update.yml"]

permissions:
  contents: write           # commit the sector cache / build stamp
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard
        run: python3 build/pipeline.py --out dist --max-workers 6

      - name: Record build stamp
        run: |
          python3 - <<'PY'
          import json, datetime, os
          stamp = {"built": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                   "run": os.environ.get("GITHUB_RUN_NUMBER")}
          json.dump(stamp, open("data/last_build.json", "w"), indent=1)
          PY

      # Committing every run also keeps the repository "active", so GitHub does
      # not auto-disable the schedule after 60 idle days.
      # 빌드가 10분 넘게 걸려서, 그 사이 사람이 main 에 새 커밋을 밀어 두면
      # 여기 push 가 거부된다. 예전엔 그대로 실패해 버려서 — 스텝이 죽으면
      # 뒤따르는 upload-pages-artifact·deploy 가 통째로 건너뛰어진다 — 멀쩡히
      # 끝낸 빌드를 통째로 버리고 배포도 안 됐다. 캐시 커밋은 어디까지나
      # 부수적인 일이니, 리베이스로 한 번 더 시도하되 그래도 안 되면 포기하고
      # 배포는 계속한다.
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sectors.json data/fundamentals.json data/kospi_industries.json data/prices_cache.json data/sp500_roster.json data/thirteenf_cache.json data/last_build.json
          git diff --staged --quiet && echo "바뀐 데이터 없음" && exit 0
          git commit -m "chore: refresh index membership + build stamp [skip ci]"
          for attempt in 1 2 3; do
            if git push; then echo "데이터 커밋 push 완료"; exit 0; fi
            echo "push 거부됨 — origin/main 위로 리베이스 후 재시도 ($attempt)"
            git pull --rebase origin main || break
          done
          echo "::warning::데이터 캐시 커밋을 push 하지 못했습니다 — 배포는 그대로 진행합니다"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
